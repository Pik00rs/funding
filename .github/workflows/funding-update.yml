name: Update funding data

on:
  schedule:
    - cron: '5 * * * *'        # toutes les heures, à HH:05
  workflow_dispatch:            # bouton "Run workflow" manuel
    inputs:
      min_oi:
        description: "OI minimum ($) pour fetch l'historique"
        required: false
        default: "500000"

permissions:
  contents: write               # nécessaire pour committer le JSON

concurrency:
  group: funding-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate funding-data.json
        env:
          MIN_OI: ${{ github.event.inputs.min_oi || '500000' }}
          SLEEP_MS: '80'
        run: node scripts/fetch-funding.js

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add funding-data.json
          if git diff --staged --quiet; then
            echo "Aucun changement."
          else
            git commit -m "data: maj funding $(date -u +'%Y-%m-%dT%H:%MZ')"
            git push
          fi
